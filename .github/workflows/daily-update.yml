name: 每日自动更新
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - run: |
          git config user.name "auto-bot"
          git config user.email "bot@canyin-ai-news"
          git add articles.json
          git commit -m "每日更新" || echo "无变化"
          git push
