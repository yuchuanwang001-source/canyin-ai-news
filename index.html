<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>餐饮AI情报站</title>
<!-- Google Fonts removed for faster loading in China -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<style>
:root {
  --bg: #08080d;
  --bg2: #0e0e16;
  --bg3: #12121e;
  --border: rgba(255,255,255,0.05);
  --border-hover: rgba(255,255,255,0.1);
  --text: #f1f5f9;
  --text-dim: #8892a8;
  --text-muted: #5a6478;
  --accent-blue: #60a5fa;
  --accent-orange: #f59e0b;
  --accent-amber: #d97706;
  --accent-bg: rgba(96,165,250,0.08);
  --tag-bg: rgba(255,255,255,0.03);
  --tag-text: #8892a8;
  --header-bg: rgba(8,8,13,0.88);
  --logo-from: #60a5fa;
  --logo-to: #f59e0b;
  --card-hover: #13131f;
  --separator: rgba(255,255,255,0.04);
  --glow: rgba(96,165,250,0.06);
  --highlight: rgba(245,158,11,0.2);
  --highlight-text: #fbbf24;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg2: #ffffff; --bg3: #fafbfc;
  --border: rgba(0,0,0,0.06); --border-hover: rgba(0,0,0,0.12);
  --text: #0f172a; --text-dim: #475569; --text-muted: #94a3b8;
  --accent-blue: #2563eb; --accent-orange: #d97706; --accent-amber: #b45309;
  --accent-bg: rgba(37,99,235,0.06);
  --tag-bg: rgba(0,0,0,0.03); --tag-text: #64748b;
  --header-bg: rgba(246,248,250,0.9);
  --card-hover: #f8fafc;
  --separator: rgba(0,0,0,0.05);
  --glow: rgba(37,99,235,0.04);
  --highlight: rgba(217,119,6,0.12);
  --highlight-text: #92400e;
}
[data-theme="system"] {
  @media (prefers-color-scheme: light) {
    --bg: #f6f8fa; --bg2: #ffffff; --bg3: #fafbfc;
    --border: rgba(0,0,0,0.06); --border-hover: rgba(0,0,0,0.12);
    --text: #0f172a; --text-dim: #475569; --text-muted: #94a3b8;
    --accent-blue: #2563eb; --accent-orange: #d97706; --accent-amber: #b45309;
    --accent-bg: rgba(37,99,235,0.06);
    --tag-bg: rgba(0,0,0,0.03); --tag-text: #64748b;
    --header-bg: rgba(246,248,250,0.9);
    --card-hover: #f8fafc;
    --separator: rgba(0,0,0,0.05);
    --glow: rgba(37,99,235,0.04);
    --highlight: rgba(217,119,6,0.12);
    --highlight-text: #92400e;
  }
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ===== HEADER ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  transition: background 0.3s;
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  white-space: nowrap;
  background: linear-gradient(135deg, var(--logo-from), var(--logo-to));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
}
.logo-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 6px;
  -webkit-text-fill-color: var(--text-muted);
}

/* ===== NAV TABS ===== */
nav.tabs {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 6px 14px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  white-space: nowrap;
  font-weight: 500;
}
.tab-btn:hover { color: var(--text-dim); background: var(--tag-bg); }
.tab-btn.active { color: var(--accent-blue); background: var(--accent-bg); }

/* ===== CONTROLS ===== */
.controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-box {
  position: relative;
}
.search-box input {
  background: var(--tag-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 30px 6px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  width: 160px;
  outline: none;
  transition: all 0.25s;
}
.search-box input:focus { border-color: var(--accent-blue); background: var(--accent-bg); width: 210px; }
.search-box input::placeholder { color: var(--text-muted); }
.search-box .search-icon {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px;
  display: none;
  line-height: 1;
}
.search-clear:hover { color: var(--text); }

/* ===== THEME TOGGLE ===== */
.theme-toggle {
  display: flex;
  gap: 2px;
  background: var(--tag-bg);
  border-radius: 7px;
  padding: 2px;
}
.theme-btn {
  width: 26px; height: 26px;
  border: none; background: transparent;
  border-radius: 5px; cursor: pointer;
  font-size: 13px; line-height: 26px;
  text-align: center; transition: all 0.2s;
  color: var(--text-muted);
}
.theme-btn:hover { color: var(--text-dim); }
.theme-btn.active { background: var(--accent-bg); color: var(--accent-blue); }

/* ===== MAIN ===== */
main { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

/* ===== HERO ===== */
.hero {
  margin-bottom: 20px;
}
.hero-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.hero-sub {
  font-size: 13px;
  color: var(--text-dim);
}

/* ===== STATUS BAR ===== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 10px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text-dim);
  transition: background 0.3s;
}
.status-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 6px;
}
.status-dot.green { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }

/* ===== DATE GROUP ===== */
.date-group { margin-bottom: 28px; }
.date-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0;
  padding: 10px 4px 10px 4px;
  cursor: pointer;
  user-select: none;
  border-radius: 8px;
  transition: background 0.15s;
}
.date-header:hover { background: var(--tag-bg); }
.date-header .arrow {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.date-header .arrow.collapsed { transform: rotate(-90deg); }
.date-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.date-count {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}
.date-line { flex: 1; height: 1px; background: var(--separator); }

/* ===== ARTICLE LIST ===== */
.article-list { }
.article-list.collapsed { display: none; }

/* ===== ARTICLE CARD ===== */
.article-card {
  display: block;
  padding: 14px 18px;
  background: transparent;
  border: none;
  border-radius: 0;
  margin-bottom: 0;
  text-decoration: none;
  color: inherit;
  transition: all 0.15s;
  position: relative;
  border-bottom: 1px solid var(--separator);
}
.article-card:last-child { border-bottom: none; }
.article-card:hover {
  background: var(--card-hover);
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 11.5px;
  color: var(--text-dim);
}
.card-time { color: var(--text-muted); font-feature-settings: 'tnum'; }
.card-source {
  color: var(--accent-blue);
  font-weight: 500;
  font-size: 12px;
}
.card-score {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.5;
  font-feature-settings: 'tnum';
}
.card-score.high { color: #f59e0b; opacity: 0.9; }
.card-score.med { color: #60a5fa; opacity: 0.7; }
.card-body {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.card-body-content { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 4px;
  color: var(--text);
}
.article-card:hover .card-title { color: var(--accent-blue); }
.card-title mark {
  background: var(--highlight);
  color: var(--highlight-text);
  padding: 0 2px;
  border-radius: 2px;
}
.card-summary {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.card-summary mark {
  background: var(--highlight);
  color: var(--highlight-text);
  padding: 0 2px;
  border-radius: 2px;
}
.card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.card-reason {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  padding: 6px 10px;
  background: var(--tag-bg);
  border-radius: 6px;
  line-height: 1.5;
  font-weight: 400;
}
.tag {
  padding: 2px 8px;
  background: var(--tag-bg);
  border-radius: 4px;
  font-size: 11px;
  color: var(--tag-text);
  font-weight: 400;
}

/* ===== LOADING ===== */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.loading .spinner {
  display: inline-block;
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.article-list:not(.collapsed) .article-card { animation: fadeIn 0.25s ease; }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 44px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 28px 24px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 36px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  header { position: static; }
  .header-inner { padding: 10px 14px; gap: 8px; }
  .logo { font-size: 17px; }
  .logo-sub { display: none; }
  .controls { margin-left: 0; width: 100%; }
  .search-box input { width: 100%; }
  .search-box input:focus { width: 100%; }
  nav.tabs { order: 3; width: 100%; overflow-x: auto; }
  main { padding: 14px; }
  .article-card { padding: 12px 14px; }
  .card-title { font-size: 14px; }
  .hero-title { font-size: 18px; }
}
</style>
</head>
<body>

<header>
<div class="header-inner">
  <div class="logo">餐饮AI情报站<span class="logo-sub">· 每日8:00更新</span></div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-cat="all">全部</button>
    <button class="tab-btn" data-cat="餐饮动态">🍔 餐饮动态</button>
    <button class="tab-btn" data-cat="AI动态">🤖 AI动态</button>
    <button class="tab-btn" data-cat="平台政策">📦 平台政策</button>
    <button class="tab-btn" data-cat="数据报告">📊 数据报告</button>
  </nav>
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索文章...">
      <span class="search-icon">🔍</span>
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button class="theme-btn active" data-theme="dark" title="深色">🌙</button>
      <button class="theme-btn" data-theme="light" title="浅色">☀️</button>
      <button class="theme-btn" data-theme="system" title="跟随系统">💻</button>
    </div>
  </div>
</div>
</header>

<main id="main">
  <div class="hero">
    <div class="hero-title">餐饮情报</div>
    <div class="hero-sub">每日自动聚合餐饮行业 · AI行业最新动态</div>
  </div>
  <div class="status-bar" id="statusBar">
    <span><span class="status-dot green"></span><span id="sourceCount">情报站运行中</span></span>
    <span id="updateTime">加载中...</span>
  </div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在加载最新情报...</div>
  </div>
  <div id="content"></div>
</main>

<footer>
  <p>餐饮AI情报站 · 每日8:00自动更新 · 数据来源：红餐网 / 36氪 / 公众号等</p>
</footer>

<script>
let allArticles = [], activeCategory = 'all', searchQuery = '', searchTimer;
const content = document.getElementById('content');
const loading = document.getElementById('loading');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const updateTime = document.getElementById('updateTime');
const sourceCount = document.getElementById('sourceCount');

// ===== THEME =====
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
}
setTheme(localStorage.getItem('theme') || 'dark');
document.querySelectorAll('.theme-btn').forEach(b => {
  b.addEventListener('click', () => setTheme(b.dataset.theme));
});

// ===== TABS =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    render();
  });
});

// ===== SEARCH =====
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchClear.style.display = searchInput.value ? 'block' : 'none';
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  }, 150);
});
searchInput.addEventListener('search', () => { searchQuery = ''; render(); });
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchQuery = '';
  render();
  searchInput.focus();
});

// ===== HIGHLIGHT =====
function highlight(text, q) {
  if (!q || !text) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== DATA =====
async function loadData() {
  try {
    const r = await fetch('articles.json?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    allArticles = d.articles || [];
    const src = new Set(allArticles.map(a => a.source));
    sourceCount.textContent = `情报站运行中 · ${allArticles.length} 条 · ${src.size} 个信源`;
    updateTime.textContent = '更新于 ' + (d.updated ? fmt(d.updated) : '');
    loading.style.display = 'none';
    render();
  } catch(e) {
    loading.style.display = 'none';
    content.innerHTML = `<div class="empty-state"><div class="icon">📡</div><p>数据加载失败</p><p style="font-size:12px;color:var(--text-muted);margin-top:6px">${e.message}</p></div>`;
  }
}

// ===== RENDER =====
function render() {
  let f = allArticles;
  if (activeCategory !== 'all') f = f.filter(a => a.category === activeCategory);
  const q = searchQuery;
  if (q) f = f.filter(a => matchSearch(a, q));

  if (!f.length) {
    content.innerHTML = `<div class="empty-state"><div class="icon">${q?'🔍':'📭'}</div><p>${q?'没有找到匹配的文章':'暂无今日文章'}</p></div>`;
    return;
  }

  // 按日期分组
  const groups = {};
  f.forEach(a => {
    const k = a.date || '最新';
    if (!groups[k]) groups[k] = [];
    groups[k].push(a);
  });

  // 按 dateSort 排序（2026-06-10字符串排序天然正确）
  const dates = Object.keys(groups).sort((a,b) => {
    const sa = groups[a][0].dateSort || a;
    const sb = groups[b][0].dateSort || b;
    if (sa === '最新') return 1;
    if (sb === '最新') return -1;
    return sb.localeCompare(sa);
  });

  // 同一天内按时间升序（早→晚）
  dates.forEach(d => {
    groups[d].sort((a, b) => (a.timeDisplay || '').localeCompare(b.timeDisplay || ''));
  });

  let html = '';
  dates.forEach((date, di) => {
    const list = groups[date];
    html += `<div class="date-group" data-date="${date}">`;
    html += `<div class="date-header" onclick="toggleDate(this)">`;
    html += `<span class="arrow">▼</span>`;
    html += `<span class="date-label">${date}</span>`;
    html += `<span class="date-count">${list.length} 篇</span>`;
    html += `<span class="date-line"></span></div>`;
    html += `<div class="article-list">`;
    list.forEach(a => {
      const score = a.score || 0;
      const scoreClass = score >= 80 ? 'high' : score >= 60 ? 'med' : '';
      const tags = a.tags || [];
      html += `<a class="article-card" href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">`;
      html += `<div class="card-meta">`;
      if (a.timeDisplay) html += `<span class="card-time">${a.timeDisplay}</span>`;
      if (a.source) html += `<span class="card-source">${escapeHtml(a.source)}</span>`;
      if (score > 0) html += `<span class="card-score ${scoreClass}">${score}</span>`;
      html += `</div>`;
      html += `<div class="card-title">${highlight(a.title, q)}</div>`;
      if (a.summary) html += `<div class="card-summary">${highlight(a.summary, q)}</div>`;
      if (tags.length > 0) {
        html += `<div class="card-tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`;
      }
      if (a.reason) {
        html += `<div class="card-reason">${escapeHtml(a.reason)}</div>`;
      }
      html += `</a>`;
    });
    html += `</div></div>`;
  });
  content.innerHTML = html;
}
function matchSearch(a, q) {
  return a.title.toLowerCase().includes(q) ||
    (a.summary && a.summary.toLowerCase().includes(q)) ||
    (a.source && a.source.toLowerCase().includes(q)) ||
    (a.tags && a.tags.some(t => t.toLowerCase().includes(q)));
}

function toggleDate(header) {
  const list = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  if (list.classList.contains('collapsed')) {
    list.classList.remove('collapsed');
    arrow.classList.remove('collapsed');
  } else {
    list.classList.add('collapsed');
    arrow.classList.add('collapsed');
  }
}

function fmt(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch(e) { return iso; }
}

loadData();
</script>
</body>
</html>
