name: 钉钉日报
on:
  schedule:
    # 北京时间 08:05（UTC 00:05）
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_TOKEN2: ${{ secrets.DINGTALK_TOKEN2 }}
        run: python scripts/dingtalk_report.py
